name: Verify official PLE starter
on:
  push:
    branches: [verify-ple-starter]
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Preserve the original commit on a dedicated entry branch
        run: |
          set -euo pipefail
          ref=refs/heads/pi-opus-starter
          commit=22c26a93a9e4974b16e4351faab0e860ff9fb24f
          git fetch --no-tags https://github.com/physical-engineerings-last-exam/submission-template.git "$commit"
          existing=$(git ls-remote origin "$ref" | cut -f1)
          if [ -z "$existing" ]; then
            git push --force-with-lease="$ref:" origin "$commit:$ref"
          else
            test "$existing" = "$commit"
          fi
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: google-research/ple
          ref: 5cf736f8b6e6f28eea71cae52de0c3bedaa88fa2
          path: kit-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: physical-engineerings-last-exam/submission-template
          ref: 22c26a93a9e4974b16e4351faab0e860ff9fb24f
          path: starter
          fetch-depth: 0
          persist-credentials: false
      - name: Check complete local checkout
        run: |
          git -C starter switch -C main 22c26a93a9e4974b16e4351faab0e860ff9fb24f
          test "$(git -C starter rev-parse --is-shallow-repository)" = false
          git -C starter fsck --full
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Validate configuration and committed dev artifacts
        working-directory: kit-source
        run: |
          uv run python -m kit validate ../starter
          uv run python -m kit artifacts ../starter
      - uses: actions/checkout@v4
        with:
          ref: 88d8aa56ff280bc7af36d4d2be627c0eee0eab58
          path: study
          persist-credentials: false
      - name: Reproduce the published trajectory counts
        working-directory: kit-source
        run: |
          uv run python ../study/starter-study/audit.py ../starter . "$RUNNER_TEMP/tasks.json"
          jq -en --slurpfile expected ../study/starter-study/tasks.json --slurpfile actual "$RUNNER_TEMP/tasks.json" '($expected[0] | sort_by(.id)) == ($actual[0] | sort_by(.id))'
      - name: Build the evaluation bundle in Docker
        working-directory: kit-source
        run: uv run python -m kit build ../starter
      - name: Configure the runner-local model proxy and run readiness
        env:
          MODEL_PROXY_URL: ${{ github.run_attempt > 1 && secrets.PLE_STARTER_PROXY_URL || '' }}
          MODEL_PROXY_KEY: ${{ github.run_attempt > 1 && secrets.PLE_STARTER_PROXY_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ github.run_attempt > 1 && secrets.PLE_ANTHROPIC_API_KEY || '' }}
        working-directory: kit-source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MODEL_PROXY_URL" || -n "$MODEL_PROXY_KEY" ]]; then
            uv run python -m kit check ../starter
            exit
          fi

          umask 077
          proxy_dir=$(mktemp -d "$RUNNER_TEMP/ple-proxy.XXXXXX")
          bridge=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          export MODEL_PROXY_URL="http://$bridge:4000"
          MODEL_PROXY_KEY="sk-$(openssl rand -hex 32)"
          export MODEL_PROXY_KEY
          echo "::add-mask::$MODEL_PROXY_KEY"
          cat > "$proxy_dir/config.yaml" <<'CONFIG'
          model_list:
            - model_name: claude-opus-5-5
              litellm_params:
                model: anthropic/claude-opus-5-5
          general_settings:
            master_key: os.environ/MODEL_PROXY_KEY
          litellm_settings:
            num_retries: 0
          CONFIG
          uvx --python 3.11 --from 'litellm[proxy]==1.90.0' litellm \
            --config "$proxy_dir/config.yaml" --host "$bridge" --port 4000 \
            > "$proxy_dir/server.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true; rm -rf "$proxy_dir"' EXIT
          for i in {1..120}; do
            if curl -fsS --noproxy '*' --max-time 2 "$MODEL_PROXY_URL/health/liveliness" >/dev/null 2>&1; then
              break
            fi
            kill -0 "$proxy_pid" || { echo "::error::Proxy exited during startup"; exit 1; }
            sleep 2
          done
          status=$(curl --noproxy '*' -sS -o "$proxy_dir/denied.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"model":"claude-opus-5-5","messages":[]}' \
            "$MODEL_PROXY_URL/v1/chat/completions")
          echo "Unauthenticated inference request returned HTTP $status."
          listing=$(curl --noproxy '*' -sS -o "$proxy_dir/models.json" -w '%{http_code}' \
            -H "Authorization: Bearer $MODEL_PROXY_KEY" "$MODEL_PROXY_URL/v1/models")
          echo "Authenticated model listing returned HTTP $listing."
          if [[ "$status" != 401 && "$status" != 403 || "$listing" != 200 ]]; then
            if [[ -z "$ANTHROPIC_API_KEY" ]]; then
              for response in "$proxy_dir/denied.json" "$proxy_dir/models.json"; do
                jq -r '.error | if type == "object" then [.type,.code,.message] | @tsv else empty end' "$response" | cut -c1-300
              done
            fi
            echo "::error::Proxy authentication probes failed."
            exit 1
          fi
          jq -e 'any(.data[]; .id == "claude-opus-5-5")' "$proxy_dir/models.json" >/dev/null
          echo "Proxy authentication passed and the Claude Opus 5.5 route is registered."
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::error::Live inference requires a funded Anthropic API credential. No model request was made."
            exit 1
          fi
          uv run python -m kit check ../starter
